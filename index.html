<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <meta name="theme-color" content="#6c5ce7">
    <meta name="description" content="دیکشنری شخصی - ذخیره و مدیریت کلمات با تلفظ صوتی">
    <title>📚 دیکشنری شخصی من</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- هدر -->
        <header class="app-header">
            <div class="header-icon">📚</div>
            <h1>دیکشنری شخصی</h1>
            <p class="subtitle">کلمات خود را ذخیره، تلفظ و مدیریت کنید</p>
        </header>
        
        <!-- بخش تنظیمات صدا -->
        <section class="settings-bar" aria-label="تنظیمات صدا">
            <div class="setting-item">
                <label for="voiceType">
                    <span class="label-icon">🎙️</span>
                    <span>نوع صدا</span>
                </label>
                <select id="voiceType">
                    <option value="google">گوگل (آنلاین)</option>
                    <option value="system">سیستم (آفلاین)</option>
                </select>
            </div>
            
            <div class="setting-item">
                <label for="voiceSpeed">
                    <span class="label-icon">⚡</span>
                    <span>سرعت</span>
                </label>
                <select id="voiceSpeed">
                    <option value="0.5">آهسته</option>
                    <option value="0.8" selected>معمولی</option>
                    <option value="1.2">تند</option>
                </select>
            </div>
            
            <button id="testVoice" class="btn-test">
                <span>🔊</span> تست صدا
            </button>
        </section>
        
        <!-- بخش افزودن کلمه جدید -->
        <section class="add-word-section">
            <div class="input-group">
                <div class="input-wrapper">
                    <span class="input-icon">📝</span>
                    <input type="text" id="wordInput" placeholder="کلمه جدید..." autocomplete="off">
                </div>
                <div class="input-wrapper">
                    <span class="input-icon">🔤</span>
                    <input type="text" id="meaningInput" placeholder="ترجمه..." autocomplete="off">
                </div>
                <button id="addBtn" class="btn-add">
                    <span>➕</span>
                    <span>افزودن</span>
                </button>
            </div>
        </section>
        
        <!-- نوار ابزار -->
        <div class="toolbar">
            <div class="toolbar-left">
                <span class="word-count" id="wordCount">۰ کلمه</span>
            </div>
            <div class="toolbar-right">
                <button id="showStarredBtn" class="btn-tool btn-starred">
                    <span>⭐</span>
                    <span>نشان‌دارها</span>
                    <span id="starredCount" class="badge">۰</span>
                </button>
                <button id="exportBtn" class="btn-tool" title="دانلود فایل پشتیبان">
                    <span>📥</span>
                    <span class="btn-tool-text">خروجی</span>
                </button>
                <button id="importBtn" class="btn-tool" title="بارگذاری فایل پشتیبان">
                    <span>📤</span>
                    <span class="btn-tool-text">ورودی</span>
                </button>
                <input type="file" id="importInput" accept=".json" style="display: none;">
                <button id="clearAllBtn" class="btn-tool btn-danger" title="حذف همه کلمات">
                    <span>🗑️</span>
                    <span class="btn-tool-text">حذف همه</span>
                </button>
            </div>
        </div>
        
        <!-- لیست کلمات -->
        <div class="words-list" id="listContainer">
            <!-- کلمات اینجا رندر می‌شوند -->
        </div>
        
        <!-- حالت خالی -->
        <div class="empty-state" id="emptyState">
            <div class="empty-icon">📝</div>
            <h3>هنوز کلمه‌ای اضافه نکرده‌اید</h3>
            <p>از بخش بالا کلمه و ترجمه آن را وارد کنید</p>
            <p class="empty-hint">💡 نکته: بعد از افزودن، روی 🔒 کنار ترجمه بزنید تا مخفی بشه</p>
        </div>
    </div>
    
    <!-- Modal افزودن جمله -->
    <div id="sentenceModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">📖 افزودن جمله</h2>
                <button class="close-modal" id="closeSentenceModal" aria-label="بستن">&times;</button>
            </div>
            <div class="modal-body">
                <div class="detail-section">
                    <label class="detail-label">کلمه</label>
                    <div class="detail-word-display" id="modalWordDisplay"></div>
                </div>
                
                <div class="detail-section">
                    <label class="detail-label">ترجمه کلمه</label>
                    <div class="detail-meaning-display" id="modalMeaningDisplay"></div>
                </div>
                
                <div class="detail-section">
                    <label class="detail-label" for="sentenceInput">📝 جمله مثال</label>
                    <input type="text" id="sentenceInput" placeholder="یک جمله مثال بنویسید..." class="detail-input">
                </div>
                
                <div class="detail-section">
                    <label class="detail-label" for="sentenceMeaningInput">🔤 ترجمه جمله</label>
                    <input type="text" id="sentenceMeaningInput" placeholder="ترجمه جمله مثال..." class="detail-input">
                </div>
                
                <div class="modal-actions">
                    <button id="saveSentence" class="btn-save">💾 ذخیره</button>
                    <button id="cancelSentence" class="btn-cancel">انصراف</button>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Modal کلمات نشان‌دار -->
    <div id="starredModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>⭐ کلمات نشان‌دار شده</h2>
                <button class="close-modal" id="closeStarredModal" aria-label="بستن">&times;</button>
            </div>
            <div class="modal-body">
                <div id="starredList"></div>
            </div>
        </div>
    </div>
    
    <script src="./app.js"></script>
</body>
</html>
